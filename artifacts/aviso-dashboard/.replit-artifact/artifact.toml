kind = "web"
previewPath = "/"
title = "Aviso Bot Dashboard"
version = "1.0.0"
id = "artifacts/aviso-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24573

[services.development]
run = "pnpm --filter @workspace/aviso-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aviso-dashboard", "run", "build" ]
publicDir = "artifacts/aviso-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24573"
BASE_PATH = "/"
